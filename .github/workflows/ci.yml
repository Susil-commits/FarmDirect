name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ts:
    name: Backend TypeScript Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend-ts/package-lock.json'

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend-ts

      - name: Lint TypeScript backend
        run: npm run lint
        working-directory: backend-ts

      - name: Type check TypeScript backend
        run: npm run typecheck
        working-directory: backend-ts

      - name: Run backend tests
        run: npm test
        working-directory: backend-ts

      - name: Build TypeScript backend
        run: npm run build
        working-directory: backend-ts

  frontend:
    name: Frontend Build & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'F_1/package-lock.json'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: F_1

      - name: Lint frontend
        run: npm run lint
        working-directory: F_1

      - name: Build Vite frontend bundle
        run: npm run build
        working-directory: F_1
