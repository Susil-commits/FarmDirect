# Render Blueprint — Infrastructure as Code
# Place this at repo root; Render auto-detects and creates services.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: farmdirect-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: MAX_FILE_SIZE
        value: "52428800"
      - key: UPLOAD_DIR
        value: ./uploads
      # DigitalOcean Spaces (optional — app falls back to local storage)
      - key: DIGITALOCEAN_SPACES_KEY
        sync: false
      - key: DIGITALOCEAN_SPACES_SECRET
        sync: false
      - key: DIGITALOCEAN_SPACES_NAME
        sync: false
      - key: DIGITALOCEAN_SPACES_REGION
        value: nyc3
      - key: DIGITALOCEAN_SPACES_ENDPOINT
        value: https://nyc3.digitaloceanspaces.com
    autoDeploy: true
    plan: free