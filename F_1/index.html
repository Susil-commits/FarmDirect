<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#22c55e" />
    <meta name="description" content="FarmDirect - Shop fresh produce directly from local farmers. No middlemen, no hidden costs. Just fresh, honest produce at fair prices." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FarmDirect" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:title" content="FarmDirect - Rural Farmer Marketplace" />
    <meta property="og:description" content="Shop fresh produce directly from local farmers at fair prices." />
    <meta property="og:type" content="website" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: wss: data: blob: 'unsafe-inline' 'unsafe-eval';" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1595855761895-30dbfaee5e49?w=1600&h=800&fit=crop&fm=webp&q=80&auto=format" fetchpriority="high" />
    <title>FarmDirect - Rural Farmer Marketplace</title>
    <style>
      .initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        background-color: #f9fafb;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .initial-loader-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #e5e7eb;
        border-top-color: #16a34a;
        border-radius: 50%;
        animation: initial-spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes initial-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <div class="initial-loader-spinner"></div>
        <div style="color: #4b5563; font-weight: 500;">Loading FarmDirect...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
